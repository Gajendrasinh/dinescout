<div class="page-header">
  <div>
    <h1>{{ isEdit() ? 'Edit Restaurant' : 'New Restaurant' }}</h1>
    <p class="page-subtitle">
      {{ isEdit() ? 'Update details, then publish when ready.' : 'New restaurants start as a draft.' }}
    </p>
  </div>
</div>

@if (errorMessage()) {
  <p class="error-banner">{{ errorMessage() }}</p>
}

<form [formGroup]="form" (ngSubmit)="save()" class="card" style="padding: 24px; max-width: 720px;">
  <div class="form-field">
    <label for="name">Name</label>
    <input id="name" formControlName="name" />
  </div>

  <div class="form-field">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="3"></textarea>
  </div>

  <div class="form-field">
    <label for="address">Address</label>
    <input id="address" formControlName="address" />
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label for="lat">Latitude</label>
      <input id="lat" type="number" step="0.0001" formControlName="lat" />
    </div>
    <div class="form-field">
      <label for="lng">Longitude</label>
      <input id="lng" type="number" step="0.0001" formControlName="lng" />
    </div>
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label for="phone">Phone</label>
      <input id="phone" formControlName="phone" />
    </div>
    <div class="form-field">
      <label for="website">Website</label>
      <input id="website" formControlName="website" />
    </div>
  </div>

  <div class="form-field">
    <label for="priceRange">Price Range</label>
    <select id="priceRange" formControlName="priceRange">
      @for (p of priceOptions; track p) {
        <option [value]="p">{{ p }}</option>
      }
    </select>
  </div>

  <div class="form-field">
    <label>Cuisines</label>
    <div class="chip-select">
      @for (c of cuisines(); track c.id) {
        <button
          type="button"
          [class.selected]="selectedCuisines().includes(c.slug)"
          (click)="toggleCuisine(c.slug)"
        >
          {{ c.emoji }} {{ c.name }}
        </button>
      }
    </div>
  </div>

  <div class="form-field">
    <label>Dietary Options</label>
    <div class="chip-select">
      @for (d of dietaryOptions(); track d.id) {
        <button
          type="button"
          [class.selected]="selectedDietary().includes(d.slug)"
          (click)="toggleDietary(d.slug)"
        >
          {{ d.emoji }} {{ d.label }}
        </button>
      }
    </div>
  </div>

  <div style="display:flex; gap: 10px; margin-top: 8px;">
    <button type="submit" class="btn" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <button type="button" class="btn btn--outline" (click)="cancel()">Cancel</button>
  </div>
</form>
